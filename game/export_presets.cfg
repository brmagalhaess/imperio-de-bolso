; Presets de exportação. Senhas/keystores de release NÃO ficam aqui:
; o Godot as guarda em .godot/export_credentials.cfg (ignorado pelo Git).

[preset.0]

name="Android"
platform="Android"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*"
export_path="build/android/imperio-de-bolso-debug.apk"

[preset.0.options]

gradle_build/use_gradle_build=false
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=true
version/code=1
version/name="1.0.0"
package/unique_name="br.com.imperiodebolso.game"
package/name="Império de Bolso"
package/signed=true
launcher_icons/main_192x192="res://assets/app_icon/icon_192.png"
launcher_icons/adaptive_foreground_432x432="res://assets/app_icon/adaptive_fg_432.png"
launcher_icons/adaptive_background_432x432="res://assets/app_icon/adaptive_bg_432.png"
launcher_icons/adaptive_monochrome_432x432="res://assets/app_icon/monochrome_432.png"
; Backup automático do Android (Google): a conta convidada (user://session.cfg) volta ao
; reinstalar ou trocar de aparelho — senão o progresso se perde.
user_data_backup/allow=true
screen/immersive_mode=true
permissions/internet=true

