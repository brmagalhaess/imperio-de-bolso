# nginx do servidor (fora do Docker) → stack do Dokploy publicada no loopback.
# Instalar: copiar para /etc/nginx/sites-available/imperio.conf, criar o link em sites-enabled,
# `nginx -t && systemctl reload nginx` e emitir os certificados:
#   certbot --nginx -d api-imperio.crowntech.com.br -d admin-imperio.crowntech.com.br

server {
    listen 80;
    server_name api-imperio.crowntech.com.br;

    client_max_body_size 32k;   # a API recusa corpos acima de 16 KB

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}

server {
    listen 80;
    server_name admin-imperio.crowntech.com.br;

    location / {
        proxy_pass http://127.0.0.1:3011;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
