# Painel admin: arquivos estáticos + /api repassado para a API (mesma origem, sem CORS).
# `imperio-api` é um apelido único (a stack de produção divide rede com outros serviços).
server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://imperio-api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    try_files $uri /index.html;
  }
}
